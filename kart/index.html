<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volkan Tarot Ücretsiz Kart Açılımı</title>
<link rel="stylesheet" href="fx.css">
<script src="fx.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Figtree:wght@400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Gece mürekkebi zemin, safran altın vurgu, gül ve zümrüt yardımcı; tek tema: mum ışığında masa */
  --ink:#0a0817;
  --ink-2:#151131;
  --saffron:#e8bd5a;
  --rose:#e07a98;
  --emerald:#41c9a2;
  --paper:#f8f2e6;
  --muted:#d2c8e2;
  --font-display:"Cinzel", "Times New Roman", serif;
  --font-serif:"Lora", Georgia, serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink);
  background-image:
    radial-gradient(900px 500px at 15% -10%, rgba(239,90,122,.28), transparent 60%),
    radial-gradient(800px 520px at 100% 10%, rgba(47,195,154,.20), transparent 60%),
    radial-gradient(900px 600px at 50% 110%, rgba(244,178,62,.18), transparent 60%);
  background-attachment:fixed;
  color:var(--paper);
  font-family:var(--font-body);
  line-height:1.5;
  min-height:100%;
}
canvas#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:28px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:20px;letter-spacing:.06em;color:var(--saffron);text-decoration:none}
.brand small{display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.wa-mini{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(47,195,154,.6);color:var(--emerald);text-decoration:none;font-weight:700;font-size:14px}
.wa-mini:hover{background:rgba(47,195,154,.12)}
.hero{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.hero h1{font-family:var(--font-display);font-size:clamp(30px,7vw,58px);line-height:1.08;margin:0;text-wrap:balance;
  background:linear-gradient(100deg,var(--saffron) 10%,#ffd98a 40%,var(--rose) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-family:var(--font-serif);font-size:clamp(19px,3.4vw,24px);color:var(--muted);margin:0;max-width:34ch}
.panel{background:linear-gradient(180deg,rgba(26,20,48,.85),rgba(13,10,26,.85));border:1px solid rgba(244,178,62,.25);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron)}
.step b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--saffron);color:var(--ink);font-size:13px;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;border:1px solid rgba(251,241,220,.25);background:transparent;color:var(--paper);padding:10px 16px;border-radius:999px;font:500 15px var(--font-body);cursor:pointer;display:flex;gap:8px;align-items:center;transition:transform .15s, background .15s, border-color .15s}
.chip:hover{transform:translateY(-1px);border-color:var(--saffron)}
.chip[aria-pressed="true"]{background:var(--saffron);color:var(--ink);border-color:var(--saffron);font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%}
label.q{font-size:14px;color:var(--muted)}
#question{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(251,241,220,.22);background:rgba(13,10,26,.6);color:var(--paper);font:400 16px var(--font-body)}
#question:focus{outline:2px solid var(--saffron);outline-offset:2px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.slot .label{font-family:var(--font-serif);font-style:italic;font-size:18px;color:var(--muted)}
.slot .frame{width:100%;max-width:150px;aspect-ratio:300/520;border-radius:12px;border:1.5px dashed rgba(244,178,62,.4);display:grid;place-items:center;color:rgba(244,178,62,.6);font-size:28px;position:relative;perspective:900px}
.slot.filled .frame{border-style:solid;border-color:transparent}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{transform:rotateY(180deg);background:#efe6cf}
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.face.front.rev img{transform:rotate(180deg)}
.back{background-color:#2a1d52;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(244,178,62,.9) 0 7%, transparent 7.5%),
    radial-gradient(circle at 50% 50%, transparent 0 20%, rgba(244,178,62,.55) 20.5% 21.5%, transparent 22%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(239,90,122,.55) 0 10deg, transparent 10deg 20deg),
    linear-gradient(160deg,#3a1f63,#1b1440 55%,#3d1534);
  border:2px solid var(--saffron);box-shadow:inset 0 0 0 4px #1b1440, inset 0 0 0 5px rgba(244,178,62,.6)}
.deck-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.deckNote{margin:0;font-family:var(--font-serif);font-style:italic;font-size:18px;color:var(--muted);text-align:center}
.counter{font-size:14px;color:var(--muted)}
.counter strong{color:var(--saffron);font-size:18px}
.btn-ghost{appearance:none;background:transparent;border:1px solid rgba(251,241,220,.25);color:var(--paper);padding:8px 14px;border-radius:999px;font:500 14px var(--font-body);cursor:pointer}
.btn-ghost:hover{border-color:var(--saffron)}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;padding:6px 2px}
.dcard{appearance:none;padding:0;border-radius:6px;aspect-ratio:300/520;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, opacity .3s;box-shadow:0 6px 14px rgba(0,0,0,.4);animation:deal .6s both}
.dcard:hover,.dcard:focus-visible{transform:translateY(-8px) rotate(-2deg);box-shadow:0 14px 26px rgba(244,178,62,.35)}
.dcard:focus-visible{outline:2px solid var(--saffron);outline-offset:3px}
.dcard.taken{opacity:0;pointer-events:none;transform:translateY(-30px) scale(.8)}
.deck.locked .dcard{cursor:default}
@keyframes deal{from{opacity:0;transform:translateY(18px) rotate(6deg)}to{opacity:1;transform:none}}
.cta-main{appearance:none;border:0;cursor:pointer;padding:16px 26px;border-radius:999px;font:700 18px var(--font-body);color:var(--ink);
  background:linear-gradient(100deg,var(--saffron),#ffd98a 50%,var(--rose));box-shadow:0 10px 30px rgba(244,178,62,.35);align-self:center;transition:transform .15s, filter .15s}
.cta-main:hover{transform:translateY(-2px)}
.cta-main:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed;transform:none;box-shadow:none}
.reading{display:flex;flex-direction:column;gap:14px}
.rcard{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;padding:14px;border-radius:16px;background:rgba(251,241,220,.05);border-left:4px solid var(--c,var(--saffron))}
.rcard img{width:72px;border-radius:8px;display:block}
.rcard img.rev{transform:rotate(180deg)}
.rcard h3{margin:0;font-family:var(--font-serif);font-size:24px;line-height:1.1}
.rcard .pos{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--c,var(--saffron));font-weight:700}
.pill{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;vertical-align:middle}
.pill.up{background:rgba(47,195,154,.18);color:var(--emerald)}
.pill.rv{background:rgba(239,90,122,.18);color:var(--rose)}
.rcard p{margin:8px 0 0;color:#eadfca;line-height:1.6}
.summary{padding:18px;border-radius:16px;background:linear-gradient(135deg,rgba(244,178,62,.14),rgba(239,90,122,.12));border:1px solid rgba(244,178,62,.35)}
.summary h3{margin:0 0 6px;font-family:var(--font-serif);font-size:24px;color:var(--saffron)}
.summary p{margin:0 0 8px;color:var(--paper)}.summary p:last-child{margin-bottom:0}
.rcard p strong{color:var(--paper);font-weight:600}
.teaser{font-family:var(--font-serif);font-style:italic;font-size:21px;line-height:1.35;color:var(--paper);text-align:center;max-width:40ch;align-self:center;margin:4px 0}
.wa-big{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;padding:18px 22px;border-radius:18px;background:linear-gradient(100deg,#1fa982,#2fc39a);color:#05261c;font:700 19px var(--font-body);box-shadow:0 12px 34px rgba(47,195,154,.35);animation:pulse 2.4s ease-in-out infinite}
.wa-big:hover{filter:brightness(1.06)}
@keyframes pulse{0%,100%{box-shadow:0 12px 34px rgba(47,195,154,.30)}50%{box-shadow:0 12px 44px rgba(47,195,154,.6)}}
.wa-note{text-align:center;font-size:14px;color:var(--muted)}
.wa-note strong{color:var(--paper);white-space:nowrap}
.limit{padding:12px 14px;border-radius:12px;background:rgba(239,90,122,.12);border:1px solid rgba(239,90,122,.4);font-size:15px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.perk{padding:16px;border-radius:16px;background:rgba(251,241,220,.04);border:1px solid rgba(251,241,220,.1)}
.perk h4{margin:0 0 4px;font-family:var(--font-serif);font-size:22px;color:var(--saffron)}
.perk p{margin:0;font-size:15px;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:4px}
.hidden{display:none !important}
svg.i{width:20px;height:20px;flex:none}
@media (max-width:480px){
  .panel{padding:16px;border-radius:18px}
  .deck{grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:5px}
  .rcard{grid-template-columns:60px 1fr}.rcard img{width:60px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
.lang{display:inline-flex;border:1px solid rgba(244,178,62,.5);border-radius:999px;overflow:hidden}
.lang button{appearance:none;border:0;background:transparent;color:var(--paper);font:700 13px var(--font-body);padding:8px 12px;cursor:pointer;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--saffron);color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--paper);outline-offset:-3px}
@media (max-width:400px){.wa-mini span,.brand small{display:none}.wa-mini{padding:8px 10px}}
.host{position:relative;width:min(340px,82vw);display:flex;flex-direction:column;align-items:center;gap:0;margin:6px auto 4px}
.host-frame{position:relative;width:100%;aspect-ratio:3/4;border-radius:170px 170px 22px 22px;overflow:hidden;border:2px solid var(--saffron);
  box-shadow:0 0 0 6px rgba(244,178,62,.12),0 24px 60px rgba(0,0,0,.55);transition:box-shadow .8s}
.host-img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:30% 35%;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1.02) translateY(0)}50%{transform:scale(1.045) translateY(-4px)}}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.glow.candle{left:-6%;top:47%;width:30%;height:22%;opacity:.5;background:radial-gradient(circle,rgba(255,190,90,.45),rgba(255,140,40,.25) 45%,transparent 70%);animation:flicker 1.7s infinite}
@keyframes flicker{0%,100%{opacity:.45}45%{opacity:.6}}
.glow.moon{right:4%;top:2%;width:26%;height:20%;background:radial-gradient(circle,rgba(230,235,255,.55),transparent 65%);animation:moonp 6s ease-in-out infinite}
@keyframes moonp{0%,100%{opacity:.5}50%{opacity:.9}}
.glow.cardglow{left:12%;top:20%;width:28%;height:25%;background:radial-gradient(circle,rgba(255,215,130,.95),rgba(244,178,62,.35) 40%,transparent 70%);opacity:0;transition:opacity .6s}
.sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bubble{position:relative;margin-top:-26px;max-width:92%;padding:12px 16px;border-radius:16px;background:rgba(13,10,26,.92);border:1px solid rgba(244,178,62,.55);
  font-family:var(--font-serif);font-style:italic;font-size:19px;line-height:1.3;color:var(--paper);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .4s,opacity .4s}
.bubble.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.host[data-state="ready"] .glow.cardglow{opacity:.5;animation:moonp 1.6s ease-in-out infinite}
.host[data-state="reveal"] .host-img{animation:lean 2.2s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes lean{0%{transform:scale(1.03)}35%{transform:scale(1.16) translate(4%,4%) rotate(-1deg)}100%{transform:scale(1.08) translate(1.5%,1.5%)}}
.host[data-state="reveal"] .glow.cardglow{opacity:1;animation:burst 2.2s ease-out forwards}
@keyframes burst{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.6);opacity:1}100%{transform:scale(1.1);opacity:.55}}
.host[data-state="reveal"] .host-frame,.host[data-state="done"] .host-frame{box-shadow:0 0 0 6px rgba(244,178,62,.25),0 0 50px rgba(244,178,62,.45),0 24px 60px rgba(0,0,0,.55)}
.host[data-state="done"] .host-img{transform:scale(1.08) translate(1.5%,1.5%);animation:breathe2 5.5s ease-in-out infinite}
@keyframes breathe2{0%,100%{transform:scale(1.08) translate(1.5%,1.5%)}50%{transform:scale(1.1) translate(1.5%,1%)}}
.host[data-state="done"] .glow.cardglow{opacity:.55}
@media (prefers-reduced-motion:reduce){.host-img{transform:scale(1.03)}}
.tablewrap{display:grid;grid-template-columns:minmax(140px,45%) 1fr;gap:14px;align-items:start}
.hostcol{position:sticky;top:12px;z-index:2}
.tablewrap .host{width:100%;margin:0}
.tablewrap .host-frame{border-radius:120px 120px 16px 16px}
.tablewrap .bubble{margin-top:-18px;max-width:100%;font-size:16px;padding:9px 11px}
@media (min-width:760px){.tablewrap{grid-template-columns:300px 1fr;gap:22px}.tablewrap .bubble{font-size:18px}}
@media (max-width:480px){.tablewrap{gap:10px}.tablewrap .deck{grid-template-columns:repeat(5,1fr);gap:4px}.tablewrap .bubble{font-size:14.5px;line-height:1.25}}
.host-frame{position:relative;width:100%;aspect-ratio:360/400;overflow:visible!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:none}
.host-img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;animation:float 6s ease-in-out infinite!important;transform-origin:50% 100%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.aura{position:absolute;inset:-6% -10% 0 -10%;z-index:0;border-radius:50%;background:radial-gradient(closest-side,rgba(244,178,62,.28),rgba(239,90,122,.14) 55%,transparent 75%);animation:aura 4s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.host-frame .glow.cardglow{z-index:2;left:6%;top:16%;width:32%;height:30%}
.sparks{z-index:3}
.tablewrap .bubble{margin-top:-8px}
.host[data-state="reveal"] .host-img{animation:float 6s ease-in-out infinite!important;filter:drop-shadow(0 0 18px rgba(244,178,62,.6))}
.host[data-state="done"] .host-img{transform:none;filter:drop-shadow(0 0 10px rgba(244,178,62,.35))}
.host[data-state="reveal"] .aura{animation:burst 2.2s ease-out forwards}

.top-r{display:flex;gap:10px;align-items:center}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-10px 0 -8px;padding:2px}
.subnav::-webkit-scrollbar{display:none}
.subnav a{flex:none;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid rgba(251,241,220,.12)}
.subnav a:hover,.subnav a:focus-visible{color:var(--paper);border-color:var(--saffron)}
.muted{color:var(--muted)}.small{font-size:13.5px}
.sec-h{margin:0;font-family:var(--font-serif);font-size:clamp(26px,5vw,34px);color:var(--saffron);line-height:1.1;text-wrap:balance}
.panel p{margin:0}
/* günün kartı */
.daily{flex-direction:row;align-items:center;gap:20px}
.daily-card{flex:none;width:120px;aspect-ratio:300/520;position:relative;perspective:900px;cursor:pointer;border-radius:12px}
.daily-card:focus-visible{outline:2px solid var(--saffron);outline-offset:4px}
.daily-card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.daily-card .flip.open{transform:rotateY(180deg)}
.daily-card .face.front img.rev{transform:rotate(180deg)}
.daily-card:not(:has(.open)) .back{animation:pulseb 2.4s ease-in-out infinite}
@keyframes pulseb{0%,100%{box-shadow:inset 0 0 0 4px #1b1440, inset 0 0 0 5px rgba(244,178,62,.6),0 0 0 rgba(244,178,62,0)}50%{box-shadow:inset 0 0 0 4px #1b1440, inset 0 0 0 5px rgba(244,178,62,.6),0 0 26px rgba(244,178,62,.55)}}
.daily-text{display:flex;flex-direction:column;gap:8px;min-width:0}
.daily-text h3{margin:0;font-family:var(--font-serif);font-size:26px}
.tapnote{font-family:var(--font-serif);font-style:italic;font-size:19px;color:var(--saffron)}
#dailyBody{display:flex;flex-direction:column;gap:8px}
.btn-wa-sm{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(47,195,154,.16);border:1px solid rgba(47,195,154,.6);color:var(--emerald);font-weight:700;font-size:14px;text-decoration:none}
.btn-wa-sm:hover{background:rgba(47,195,154,.26)}
/* modlar */
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(251,241,220,.22);background:transparent;color:var(--paper);padding:9px 14px;border-radius:12px;font:600 14.5px var(--font-body);cursor:pointer;text-decoration:none}
.mode[aria-selected="true"]{background:linear-gradient(100deg,var(--saffron),#ffd98a);color:var(--ink);border-color:transparent}
.mode.locked{color:var(--muted);border-style:dashed}
.mode.locked:hover{color:var(--paper);border-color:var(--rose)}
.lk{width:14px;height:14px}
.deck-tools{display:flex;gap:10px;align-items:center}
.slots.one{grid-template-columns:1fr;justify-items:center}
.slots.one .slot{width:min(170px,50%)}
.deck.shuffling .dcard{transition:transform .5s cubic-bezier(.5,0,.3,1),opacity .5s;transform:translate(var(--sx,0),var(--sy,0)) rotate(8deg) scale(.9);opacity:.6}
.deck.shuffling .dcard:nth-child(odd){--sx:30px;--sy:-10px}.deck.shuffling .dcard:nth-child(even){--sx:-30px;--sy:10px}
.limit p+p{margin-top:6px}
.cd strong{font-variant-numeric:tabular-nums;color:var(--saffron);font-size:18px;letter-spacing:.04em}
/* sonuç */
.codebar{align-self:flex-start;font-size:14px;color:var(--muted);padding:6px 12px;border-radius:999px;border:1px solid rgba(244,178,62,.35)}
.codebar strong{color:var(--saffron);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.actions .btn-ghost{display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:10px 16px}
.yn{text-align:center;padding:20px;border-radius:18px;background:rgba(251,241,220,.05);border:1px solid rgba(251,241,220,.14)}
.yn span{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.yn strong{display:block;font-family:var(--font-display);font-size:clamp(48px,12vw,76px);line-height:1.1;margin:6px 0}
.yn.yes strong{color:var(--emerald)}.yn.no strong{color:var(--rose)}.yn.maybe strong{color:var(--saffron)}
.yn p{color:var(--paper);font-family:var(--font-serif);font-size:20px;font-style:italic}
/* geçmiş */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:14px;background:rgba(251,241,220,.04);border:1px solid rgba(251,241,220,.1)}
.hthumbs{display:flex;gap:3px}.hthumbs img{width:26px;border-radius:4px}.hthumbs img.rev{transform:rotate(180deg)}
.hmeta{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13.5px}.hmeta span{color:var(--muted)}
.hnames{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-ghost.sm{padding:6px 12px;font-size:13px}
/* paketler */
.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pk{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;background:rgba(251,241,220,.04);border:1px solid rgba(251,241,220,.1)}
.pk h4{margin:0;font-family:var(--font-serif);font-size:22px;color:var(--paper)}
.pk p{color:var(--muted);font-size:15px;flex:1}
.pk-ic{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(244,178,62,.15);color:var(--saffron);font-size:18px}
.about p{max-width:65ch;font-size:16.5px}
/* sözlük */
#dictSearch{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(251,241,220,.22);background:rgba(13,10,26,.6);color:var(--paper);font:400 16px var(--font-body)}
#dictSearch:focus{outline:2px solid var(--saffron);outline-offset:2px}
.dict-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;max-height:640px;overflow-y:auto;padding-inline-end:4px}
.dcard-i{border-radius:12px;background:rgba(251,241,220,.04);border:1px solid rgba(251,241,220,.1);padding:8px 10px}
.dcard-i summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;font-weight:600}
.dcard-i summary::-webkit-details-marker{display:none}
.dcard-i summary img{width:34px;border-radius:4px}
.dcard-i p{margin:8px 0 0;font-size:14.5px;line-height:1.5}
.dcard-i[open]{border-color:rgba(244,178,62,.45)}
/* SSS */
.faq{border-bottom:1px solid rgba(251,241,220,.12);padding:12px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:16.5px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--saffron);font-size:22px;line-height:1}
.faq[open] summary::after{content:"–"}
.faq p{margin:8px 0 0;color:var(--muted);max-width:65ch}
/* ses ve modal */
.sound{position:fixed;right:14px;bottom:14px;z-index:20;width:46px;height:46px;border-radius:50%;border:1px solid rgba(244,178,62,.6);background:rgba(13,10,26,.85);color:var(--saffron);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sound .on{display:none}.sound[aria-pressed="true"] .on{display:block}.sound[aria-pressed="true"] .off{display:none}
[dir="rtl"] .sound{right:auto;left:14px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,3,12,.8);display:grid;place-items:center;padding:16px}
.modal-box{width:min(420px,100%);max-height:92vh;overflow:auto;background:var(--ink-2);border:1px solid rgba(244,178,62,.4);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center}
.modal-box h3{margin:0;font-family:var(--font-serif);font-size:24px;color:var(--saffron)}
#shareImg{width:100%;border-radius:12px;-webkit-touch-callout:default}
/* Arapça */
:root[lang="ar"] body{font-family:"Cairo",var(--font-body)}
:root[lang="ar"] .hero p,:root[lang="ar"] .bubble,:root[lang="ar"] .teaser,:root[lang="ar"] .slot .label,:root[lang="ar"] .deckNote,:root[lang="ar"] .tapnote,:root[lang="ar"] .yn p{font-family:"Amiri",serif;font-style:normal}
:root[lang="ar"] .rcard h3,:root[lang="ar"] .summary h3,:root[lang="ar"] .sec-h,:root[lang="ar"] .pk h4,:root[lang="ar"] .daily-text h3,:root[lang="ar"] .perk h4{font-family:"Amiri",serif}
:root[lang="ar"] .hero h1{font-family:"Amiri",serif;font-weight:700}
:root[lang="ar"] .step,:root[lang="ar"] .rcard .pos{letter-spacing:0}
:root[lang="ar"] .pill{margin-left:0;margin-right:6px}
@media (max-width:480px){.daily{gap:14px}.daily-card{width:96px}.daily-text h3{font-size:22px}.hist li{grid-template-columns:auto 1fr}.hist li .btn-ghost{grid-column:1/-1}}
